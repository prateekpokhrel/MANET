spring.application.name=backend
server.port=8087

# PostgreSQL
spring.datasource.url=jdbc:postgresql://localhost:5433/manet_ai
spring.datasource.username=postgres
spring.datasource.password=kiit

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

# ============================================================
# AI SERVICE
# ============================================================

manet.ai.base-url=http://localhost:8005

manet.ai.enabled=true

manet.ai.fail-fast=false

manet.ai.recovery-trigger-threshold=0.50

# Automatically execute AI recovery decisions.
manet.ai.auto-recovery-enabled=true

# Automatically analyze the MANET during simulation.
manet.ai.auto-analysis-enabled=true

# Run AI every N simulation steps.
# 1 = every simulation timestep.
manet.ai.auto-analysis-interval-steps=1